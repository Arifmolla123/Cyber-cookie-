<!-- language: HTML, file: www/index.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Cookie Pro</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; }
    body { background-color: #0b0f19; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { width: 100%; max-width: 400px; background: #151f32; padding: 30px; border-radius: 20px; border: 1px solid #1e293b; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; position: relative; }
    .container::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, #00ff41, transparent); }
    h1 { color: #00ff41; margin-bottom: 10px; font-size: 26px; text-shadow: 0 0 15px rgba(0,255,65,0.4); letter-spacing: 1px; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
    label { display: block; text-align: left; color: #ccc; margin-bottom: 5px; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
    select, textarea { width: 100%; background: #0b0f19; border: 1px solid #334155; color: #fff; padding: 15px; border-radius: 12px; margin-bottom: 20px; outline: none; font-size: 15px; }
    select:focus, textarea:focus { border-color: #00ff41; box-shadow: 0 0 0 3px rgba(0,255,65,0.1); }
    textarea { height: 120px; resize: none; color: #00ff41; font-family: monospace; }
    button { width: 100%; padding: 16px; background: #00ff41; color: #000; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s; }
    button:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div class="container">
    <h1>CYBER COOKIE PRO</h1>
    <p>Select a platform and paste the cookie to login.</p>
    
    <label>Select Platform</label>
    <select id="siteSelect">
      <option value="facebook">Facebook</option>
      <option value="whatsapp">WhatsApp</option>
      <option value="google">Google</option>
      <option value="instagram">Instagram</option>
    </select>
    
    <label>Session Cookie</label>
    <textarea id="cookieInput" placeholder="Paste your cookie here..."></textarea>
    
    <button onclick="loginWithCookie()">Login Now</button>
  </div>

  <script>
    function loginWithCookie() {
      const site = document.getElementById('siteSelect').value;
      const cookie = document.getElementById('cookieInput').value.trim();
      
      if (!cookie) {
        return alert("Please enter a cookie.");
      }
      
      if (window.CookieInterface && window.CookieInterface.injectCookieAndLogin) {
        window.CookieInterface.injectCookieAndLogin(site, cookie);
      } else {
        alert("WebView Interface not found. Are you using the APK?");
      }
    }
  </script>
</body>
</html>
