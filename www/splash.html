<!-- language: HTML, file: www/splash.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Cookie Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; }
    body { 
      background-color: #0b0f19; 
      color: #00ff41; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      overflow: hidden;
    }
    .logo-container {
      width: 120px;
      height: 120px;
      margin-bottom: 20px;
      animation: pulseGlow 2s infinite alternate;
    }
    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 20px;
    }
    h1 {
      font-size: 32px;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow: 0 0 20px #00ff41;
      animation: fadeIn 1.5s ease-in-out;
    }
    .subtitle {
      color: #94a3b8;
      font-size: 14px;
      margin-top: 10px;
      letter-spacing: 2px;
      opacity: 0;
      animation: fadeIn 1.5s ease-in-out 0.5s forwards;
    }
    
    @keyframes pulseGlow {
      0% { transform: scale(0.95); filter: drop-shadow(0 0 10px #00ff41); }
      100% { transform: scale(1.05); filter: drop-shadow(0 0 30px #00ff41); }
    }
    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img src="icon.png" alt="Logo">
  </div>
  <h1>CYBER COOKIE PRO</h1>
  <p class="subtitle">Advanced Cookie Login</p>

  <script>
    // ৩ সেকেন্ড পর মেইন পেজে চলে যাবে
    setTimeout(() => {
      window.location.href = "index.html";
    }, 3000);
  </script>
</body>
  </html>
